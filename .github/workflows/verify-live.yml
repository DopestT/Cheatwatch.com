name: Verify THE RECORD live deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel loader is publicly reachable
        run: |
          set -e
          curl -fsSL --max-time 20 -o /tmp/site.html https://the-record-evidence-archive-dopestts-projects.vercel.app/
          grep -q "Loading THE RECORD" /tmp/site.html
      - name: Verify archive source is publicly readable and CORS-enabled
        run: |
          set -e
          curl -fsSI --max-time 20 https://raw.githubusercontent.com/DopestT/Cheatwatch.com/main/index.html | tr -d '\r' > /tmp/headers.txt
          grep -qi '^access-control-allow-origin: \*$' /tmp/headers.txt
          curl -fsSL --max-time 20 https://raw.githubusercontent.com/DopestT/Cheatwatch.com/main/index.html -o /tmp/archive.html
          grep -q "WATERGATE DNC BURGLARY" /tmp/archive.html
          grep -q "START AUTO SCROLL\|Start auto scroll" /tmp/archive.html
          grep -q "THE RECORD DOES NOT LABEL EVERY LISTED ACTION CRIMINAL OR UNLAWFUL" /tmp/archive.html
