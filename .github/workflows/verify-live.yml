name: Verify THE RECORD live deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public archive route
        run: |
          set -e
          code=$(curl -sS -L --max-time 30 -o /tmp/site.html -w '%{http_code}' https://dopestt.github.io/the-record/)
          echo "PUBLIC_HTTP=$code"
          head -c 300 /tmp/site.html || true
          echo
          test "$code" = "200"
          grep -q "Loading THE RECORD" /tmp/site.html
      - name: Verify archive source is readable and CORS-enabled
        run: |
          set -e
          curl -sSI --max-time 20 https://raw.githubusercontent.com/DopestT/Cheatwatch.com/main/index.html | tr -d '\r' > /tmp/headers.txt
          grep -qi '^access-control-allow-origin: \*$' /tmp/headers.txt
          curl -fsSL --max-time 20 https://raw.githubusercontent.com/DopestT/Cheatwatch.com/main/index.html -o /tmp/archive.html
          grep -q "WATERGATE DNC BURGLARY" /tmp/archive.html
          grep -q "Start auto scroll" /tmp/archive.html
          grep -q "THE RECORD DOES NOT LABEL EVERY LISTED ACTION CRIMINAL OR UNLAWFUL" /tmp/archive.html
          echo "ARCHIVE_SOURCE_OK"
