name: Verify THE RECORD live deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Vercel production alias
        run: |
          set -e
          code=$(curl -sS -L --max-time 20 -o /tmp/site.html -w '%{http_code}' https://the-record-evidence-archive-dopestts-projects.vercel.app/)
          echo "HTTP=$code"
          echo "BODY_START"
          head -c 700 /tmp/site.html || true
          echo
          echo "BODY_END"
          test "$code" = "200"
      - name: Verify archive source is publicly readable and CORS-enabled
        run: |
          set -e
          echo "RAW_HEADERS"
          curl -sSI --max-time 20 https://raw.githubusercontent.com/DopestT/Cheatwatch.com/main/index.html | tr -d '\r' | head -40
          curl -fsSL --max-time 20 https://raw.githubusercontent.com/DopestT/Cheatwatch.com/main/index.html -o /tmp/archive.html
          grep -q "WATERGATE DNC BURGLARY" /tmp/archive.html
          grep -q "Start auto scroll" /tmp/archive.html
          grep -q "THE RECORD DOES NOT LABEL EVERY LISTED ACTION CRIMINAL OR UNLAWFUL" /tmp/archive.html
          echo "ARCHIVE_SOURCE_OK"
