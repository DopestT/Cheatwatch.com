name: Verify THE RECORD live deployment

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public CDN archive route
        run: |
          set -e
          URL='https://raw.githack.com/DopestT/Cheatwatch.com/dba2158f259fc8f957104e15793fbef26df22233/index.html'
          code=$(curl -sS -L --max-time 30 -D /tmp/headers.txt -o /tmp/site.html -w '%{http_code}' "$URL")
          echo "PUBLIC_HTTP=$code"
          grep -i '^content-type:' /tmp/headers.txt | tail -1 || true
          test "$code" = "200"
          grep -qi '^content-type:.*text/html' /tmp/headers.txt
          grep -q "THE RECORD" /tmp/site.html
          grep -q "WATERGATE DNC BURGLARY" /tmp/site.html
          grep -q "Start auto scroll" /tmp/site.html
          grep -q "THE RECORD DOES NOT LABEL EVERY LISTED ACTION CRIMINAL OR UNLAWFUL" /tmp/site.html
          echo "PUBLIC_ARCHIVE_OK"
      - name: Verify canonical GitHub source
        run: |
          set -e
          curl -fsSL --max-time 20 https://raw.githubusercontent.com/DopestT/Cheatwatch.com/main/index.html -o /tmp/archive.html
          grep -q "WATERGATE DNC BURGLARY" /tmp/archive.html
          echo "SOURCE_OK"
